{% assign project = include.project %}
<article class="project-card">
    <a
        class="project-card-media"
        href="{{ project.url }}"
        aria-label="Read {{ project.title | escape }}"
    >
        {% if project.image %}
            <img
                src="{{ project.image }}"
                alt="{{ project.imageAlt | default: project.title | escape }}"
                loading="lazy"
            >
        {% else %}
            <span class="project-card-placeholder" aria-hidden="true">
                {{ project.title | slice: 0, 1 }}
            </span>
        {% endif %}
    </a>
    <div class="project-card-body">
        <div class="project-card-meta">
            <span>
                Updated
                <time datetime="{{ project.lastUpdated | date: '%Y-%m-%d' }}">
                    {{ project.lastUpdated | date: "%B %-d, %Y" }}
                </time>
            </span>
        </div>
        <h3 class="project-card-title">
            <a href="{{ project.url }}">{{ project.title }}</a>
        </h3>
        <p>{{ project.description }}</p>
        <a class="project-card-link" href="{{ project.url }}">
            Read project <span aria-hidden="true">&rarr;</span>
        </a>
    </div>
</article>
